name: Build Safari for Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SafariApp.csproj

      - name: Build and Publish Standalone Release
        run: |
          dotnet publish SafariApp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish-output

      - name: Archive Safari Build
        run: |
          Compress-Archive -Path publish-output\* -DestinationPath Safari-Windows-x64.zip

      - name: Upload Safari Windows x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: safari-windows-x64
          path: Safari-Windows-x64.zip
          retention-days: 90
