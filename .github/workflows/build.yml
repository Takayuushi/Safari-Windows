name: Build Chronos Compass for Windows (WebKit)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download WebKit SDK
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path sdk-dl | Out-Null
          Write-Host "Downloading WebKit WinCairo SDK release..."
          try {
            gh release download webkit-sdk-7c3fb01227f0 --repo Experimental1X/Lumen-webkit --pattern "webkit-sdk-win-x64.zip" --dir sdk-dl --clobber
          } catch {
            Write-Host "gh download fallback to curl..."
            curl.exe -L -f -o sdk-dl/webkit-sdk-win-x64.zip "https://github.com/Experimental1X/Lumen-webkit/releases/download/webkit-sdk-7c3fb01227f0/webkit-sdk-win-x64.zip"
          }
          if (-not (Test-Path "sdk-dl\webkit-sdk-win-x64.zip")) {
            curl.exe -L -f -o sdk-dl/webkit-sdk-win-x64.zip "https://github.com/Experimental1X/Lumen-webkit/releases/download/webkit-sdk-7c3fb01227f0/webkit-sdk-win-x64.zip"
          }
          Expand-Archive -Path sdk-dl\webkit-sdk-win-x64.zip -DestinationPath sdk -Force
          Get-ChildItem sdk
          if (-not (Test-Path "sdk\lib\WebKit2.lib")) { throw "WebKit2.lib missing in SDK" }

      - name: Configure CMake
        shell: powershell
        run: |
          cmake -S . -B build -A x64 "-DWEBKIT_SDK_DIR=$env:GITHUB_WORKSPACE\sdk" -DCHRONOS_COPY_RUNTIME=OFF
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed." }

      - name: Build Chronos Release
        shell: powershell
        run: |
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { throw "Build failed." }

      - name: Package Chronos Compass with WebKit Runtime
        shell: powershell
        run: |
          $dist = "dist\Chronos Compass"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item -Path "sdk\runtime\*" -Destination $dist -Recurse -Force
          Copy-Item -Path "build\Release\Chronos.exe" -Destination $dist -Force
          Copy-Item -Path "resources\app.ico" -Destination $dist -Force
          Compress-Archive -Path "dist\Chronos Compass" -DestinationPath "Chronos-Compass-Windows-x64.zip" -Force
          Write-Host "Archive created: Chronos-Compass-Windows-x64.zip"

      - name: Upload Chronos Compass WebKit Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronos-compass-windows-x64
          path: Chronos-Compass-Windows-x64.zip
          retention-days: 90

