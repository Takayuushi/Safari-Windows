[package]
name = "safari-windows"
version = "26.0.0"
description = "A macOS Sequoia / Safari 26 inspired glassmorphic browser for Windows"
authors = ["Takayuushi"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["window-minimize", "window-maximize", "window-close", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
